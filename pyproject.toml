[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-corpscore"
version = "0.1.0"
description = "Alliance Auth plugin: a credit score for corp members. FICO-style 300-850 score from alliance FATs, corp FATs, activity, CorpTools audit and Discord engagement."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "aa-corpscore contributors" }]
license = { text = "MIT" }
dependencies = [
    "allianceauth>=5.2.0,<6",
    "requests>=2.28",
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-django>=4"]

[tool.setuptools.packages.find]
include = ["aa_corpscore*"]

[tool.setuptools.package-data]
aa_corpscore = [
    "templates/aa_corpscore/*.html",
    "static/aa_corpscore/*",
]
